abstract: "We independently implement seven confidence-interval procedures from Hesterberg's study of resampling inference. All 20 printed numerical cells of Table 5 in the extended manuscript agree with direct calculations at the published precision. A fixed-seed experiment evaluates normal and exponential sample means at n=10,20,40, using 5,000 original samples and 1,999 bootstrap resamples per condition. Conditioning on centered or normalized residuals reduces outer simulation noise. The experiment compares one-sided miss probabilities and their Monte Carlo uncertainty, and a paired experiment checks sensitivity to 9,999 resamples. For exponential data at n=10, bootstrap-t coverage is 0.9407, compared with 0.9001 for Student t. The largest-magnitude finite-B tail-probability change is -0.00081. The replication concerns a prespecified small-sample subset of the original study."
